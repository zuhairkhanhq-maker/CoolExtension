name: Extension QA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  billing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: bypass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:fixture-only@localhost:5432/bypass_test
      DB_SSL: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: billing
      - run: npm audit --omit=dev --audit-level=high
        working-directory: billing
      - run: npm test
        working-directory: billing
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Worker and model checks
        if: ${{ !cancelled() }}
        run: npm run test:unit
      - name: Free engine browser fixtures
        if: ${{ !cancelled() }}
        run: npm run test:free
      - name: Free popup behavior checks
        if: ${{ !cancelled() }}
        run: npm run test:popup
      - name: Installed MV3 Pro user flow
        if: ${{ !cancelled() }}
        run: npm run test:pro
      - name: Signed billing extension flow
        if: ${{ !cancelled() }}
        run: node Bypass-Extension/tests/billing-flow.cjs
      - name: Retain test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: extension-qa-evidence
          path: |
            Bypass-Extension/tests/*results.json
            Bypass-Extension/tests/*preview.png
            Bypass-Extension/tests/pro-*.png
          if-no-files-found: warn
          retention-days: 7
