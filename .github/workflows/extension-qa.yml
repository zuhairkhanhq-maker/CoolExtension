name: Extension QA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Distribution and syntax checks
        if: ${{ !cancelled() }}
        run: npm run test:package
      - name: Worker settings and counter checks
        if: ${{ !cancelled() }}
        run: npm run test:unit
      - name: Cleanup, YouTube and streaming browser fixtures
        if: ${{ !cancelled() }}
        run: npm run test:free
      - name: Popup behavior and accessibility
        if: ${{ !cancelled() }}
        run: npm run test:popup
      - name: Installed Free extension and consecutive ad flow
        if: ${{ !cancelled() }}
        run: npm run test:installed
      - name: Package free extension
        run: npm run build -- --zip
      - name: Downloadable free extension
        uses: actions/upload-artifact@v4
        with:
          name: Bypass-Free-v0.9.1
          path: build/Bypass-Free-v0.9.1.zip
          if-no-files-found: error
      - name: Retain test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: extension-qa-evidence
          path: |
            Bypass-Extension/tests/*results.json
            Bypass-Extension/tests/*preview.png
          if-no-files-found: warn
          retention-days: 7
